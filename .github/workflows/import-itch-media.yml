name: Import itch media

on:
  push:
    paths:
      - ".github/workflows/import-itch-media.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    env:
      ITCH_URL: "https://splarg.itch.io/glitch-survivor-final-protocol"
    steps:
      - uses: actions/checkout@v4
      - name: Fetch itch artwork and screenshots
        shell: bash
        run: |
          python3 - <<'PY'
          import html as htmllib
          import os
          import re
          import urllib.request
          from pathlib import Path

          itch = os.environ["ITCH_URL"]
          req = urllib.request.Request(itch, headers={"User-Agent": "Mozilla/5.0"})
          with urllib.request.urlopen(req, timeout=30) as r:
              page = r.read().decode("utf-8", "replace")

          def clean(u):
              return htmllib.unescape(u).replace("\\/", "/")

          og = None
          for pat in (
              r'<meta[^>]+property=["\']og:image["\'][^>]+content=["\']([^"\']+)["\']',
              r'<meta[^>]+content=["\']([^"\']+)["\'][^>]+property=["\']og:image["\']',
          ):
              m = re.search(pat, page, re.I)
              if m:
                  og = clean(m.group(1))
                  break

          urls = [clean(u) for u in re.findall(r'https://img\.itch\.zone/[^"\'<>\s]+', page, re.I)]
          originals, seen = [], set()
          for u in urls:
              u = u.rstrip(")")
              if "/original/" not in u or u in seen:
                  continue
              if not re.search(r'\.(?:png|jpe?g|webp)(?:\?|$)', u, re.I):
                  continue
              seen.add(u)
              originals.append(u)

          media = Path("docs/itch")
          media.mkdir(parents=True, exist_ok=True)
          for pat in ("cover.*", "screenshot-*.*"):
              for p in media.glob(pat):
                  p.unlink()

          def fetch(url, stem):
              req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0", "Referer": itch})
              with urllib.request.urlopen(req, timeout=30) as r:
                  data = r.read()
                  ctype = (r.headers.get("Content-Type") or "").split(";")[0].lower()
              ext = {"image/png": ".png", "image/jpeg": ".jpg", "image/webp": ".webp"}.get(ctype)
              if not ext:
                  m = re.search(r'\.(png|jpe?g|webp)(?:\?|$)', url, re.I)
                  ext = "." + (m.group(1).lower().replace("jpeg", "jpg") if m else "jpg")
              path = media / f"{stem}{ext}"
              path.write_bytes(data)
              return path.as_posix()

          cover_path = fetch(og, "cover") if og else None
          shot_paths = []
          cover_norm = og.split("?", 1)[0] if og else None
          for u in originals:
              if cover_norm and u.split("?", 1)[0] == cover_norm:
                  continue
              try:
                  shot_paths.append(fetch(u, f"screenshot-{len(shot_paths)+1}"))
              except Exception as e:
                  print(f"Skipping {u}: {e}")
              if len(shot_paths) >= 3:
                  break

          readme = Path("README.md")
          text = readme.read_text(encoding="utf-8")
          text = re.sub(r'\n?<!-- splarg-itch-media:start -->.*?<!-- splarg-itch-media:end -->\n?', '\n', text, flags=re.S)
          title = re.search(r'^#\s+(.+)$', text, re.M)
          alt = title.group(1).strip() if title else "Game"

          bits = ['<!-- splarg-itch-media:start -->']
          if cover_path:
              bits += ['<p align="center">', f'  <a href="{itch}"><img src="{cover_path}" alt="{alt} cover art" width="640"></a>', '</p>']
          if shot_paths:
              bits += ['<p align="center">']
              for p in shot_paths:
                  bits.append(f'  <img src="{p}" alt="{alt} screenshot" width="31%">')
              bits += ['</p>']
          bits += ['<!-- splarg-itch-media:end -->']
          block = "\n".join(bits) + "\n"

          anchor = '<!-- splarg-storefront:end -->'
          if anchor in text:
              text = text.replace(anchor, anchor + "\n\n" + block, 1)
          else:
              m = re.search(r'^#.*$', text, re.M)
              pos = m.end() if m else 0
              text = text[:pos] + "\n\n" + block + text[pos:]
          readme.write_text(text, encoding="utf-8")
          print(f"cover={cover_path} screenshots={shot_paths}")
          PY

          rm -f .github/workflows/import-itch-media.yml
          rmdir --ignore-fail-on-non-empty .github/workflows .github 2>/dev/null || true

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Add itch.io artwork and screenshots [skip ci]"
            git push
          fi
